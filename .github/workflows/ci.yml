name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build ProjectMind Monorepo
        run: node scripts/build.js

      - name: Run Complete Automated Test Suite (50 Tests)
        run: node scripts/test.js

      - name: Package Plugins & Verify Checksums
        run: node scripts/package-plugins.js

      - name: Run System Diagnostics Doctor Check
        run: node apps/cli/dist/index.js plugin doctor

