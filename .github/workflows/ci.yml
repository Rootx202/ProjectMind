name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Build from source
        run: npm run build

      - name: Run complete test suite
        run: npm test

      - name: Run retrieval benchmark
        run: npm run benchmark

      - name: Run plugin diagnostics
        run: node apps/cli/dist/index.js plugin doctor

  release-clean-room:
    name: Clean-room rebuild, benchmark, and release packaging
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install, build, test, benchmark
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm run benchmark

      - name: Package verified release artifacts
        run: npm run release:package

      - name: Rebuild from the packaged source archive in a clean directory
        run: |
          set -euo pipefail
          rm -rf /tmp/projectmind-clean-room
          mkdir -p /tmp/projectmind-clean-room
          tar -xzf .release/projectmind-full.tar.gz -C /tmp/projectmind-clean-room
          cd /tmp/projectmind-clean-room
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm run benchmark

      - name: Verify release checksums
        run: |
          set -euo pipefail
          cd .release
          sha256sum -c SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: projectmind-release-${{ github.sha }}
          path: .release/
          if-no-files-found: error
