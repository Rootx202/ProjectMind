<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">ProjectMind — 3-Layer Persistent Memory</text>
  <!-- Subtitle -->
  <text x="450" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">All data stored locally in .projectmind/projectmind.db (SQLite 3 + WAL + FTS5)</text>

  <!-- ═══════════════ CARD 1 — Layer 1: Core Memory ═══════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="68" width="820" height="114" rx="12" ry="12" fill="#eff6ff"/>
    <!-- Left border strip -->
    <rect x="40" y="68" width="8" height="114" rx="4" ry="4" fill="#3b82f6"/>
    <rect x="44" y="68" width="4" height="114" fill="#3b82f6"/>
  </g>
  <!-- Badge L1 -->
  <circle cx="78" cy="122" r="16" fill="#3b82f6"/>
  <text x="78" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">L1</text>
  <!-- Card 1 Title -->
  <text x="106" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Core Memory — Permanent Project Identity</text>
  <!-- Card 1 Description -->
  <text x="106" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">Ultra-compact header loaded on every agent interaction. Survives restarts, path moves, and machine changes.</text>
  <!-- Chips Row 1 -->
  <!-- Chip: Stable Project UUID -->
  <rect x="106" y="128" width="140" height="26" rx="6" ry="6" fill="white" stroke="#3b82f6" stroke-width="1"/>
  <text x="176" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e3a8a">Stable Project UUID</text>
  <!-- Chip: Tech Stack & Runtime -->
  <rect x="256" y="128" width="140" height="26" rx="6" ry="6" fill="white" stroke="#3b82f6" stroke-width="1"/>
  <text x="326" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e3a8a">Tech Stack &amp; Runtime</text>
  <!-- Chip: Key Constraints & Schema v -->
  <rect x="406" y="128" width="176" height="26" rx="6" ry="6" fill="white" stroke="#3b82f6" stroke-width="1"/>
  <text x="494" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e3a8a">Key Constraints &amp; Schema v</text>

  <!-- ═══════════════ CARD 2 — Layer 2: Project Knowledge ═══════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="196" width="820" height="120" rx="12" ry="12" fill="#faf5ff"/>
    <rect x="40" y="196" width="8" height="120" rx="4" ry="4" fill="#8b5cf6"/>
    <rect x="44" y="196" width="4" height="120" fill="#8b5cf6"/>
  </g>
  <!-- Badge L2 -->
  <circle cx="78" cy="252" r="16" fill="#8b5cf6"/>
  <text x="78" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">L2</text>
  <!-- Card 2 Title -->
  <text x="106" y="224" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4c1d95">Project Knowledge — Searchable SQLite + FTS5 (BM25)</text>
  <!-- Card 2 Description -->
  <text x="106" y="243" font-family="system-ui, sans-serif" font-size="11" fill="#6d28d9">Persistent searchable knowledge base. Every record has verificationStatus, confidence score, source file, and SHA-256 fingerprint.</text>
  <!-- Chips Row 2 -->
  <!-- Chip: Modules & Symbols -->
  <rect x="106" y="256" width="136" height="26" rx="6" ry="6" fill="white" stroke="#8b5cf6" stroke-width="1"/>
  <text x="174" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4c1d95">Modules &amp; Symbols</text>
  <!-- Chip: HTTP Routes & Models -->
  <rect x="252" y="256" width="148" height="26" rx="6" ry="6" fill="white" stroke="#8b5cf6" stroke-width="1"/>
  <text x="326" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4c1d95">HTTP Routes &amp; Models</text>
  <!-- Chip: ADRs & Decisions -->
  <rect x="410" y="256" width="134" height="26" rx="6" ry="6" fill="white" stroke="#8b5cf6" stroke-width="1"/>
  <text x="477" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4c1d95">ADRs &amp; Decisions</text>
  <!-- Chip: Code Graph & Edges -->
  <rect x="554" y="256" width="142" height="26" rx="6" ry="6" fill="white" stroke="#8b5cf6" stroke-width="1"/>
  <text x="625" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4c1d95">Code Graph &amp; Edges</text>

  <!-- ═══════════════ CARD 3 — Layer 3: Task Context ═══════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="330" width="820" height="114" rx="12" ry="12" fill="#f0fdf4"/>
    <rect x="40" y="330" width="8" height="114" rx="4" ry="4" fill="#10b981"/>
    <rect x="44" y="330" width="4" height="114" fill="#10b981"/>
  </g>
  <!-- Badge L3 -->
  <circle cx="78" cy="384" r="16" fill="#10b981"/>
  <text x="78" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">L3</text>
  <!-- Card 3 Title -->
  <text x="106" y="358" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#064e3b">Task Context — Ephemeral Token-Budgeted Working Memory</text>
  <!-- Card 3 Description -->
  <text x="106" y="377" font-family="system-ui, sans-serif" font-size="11" fill="#065f46">Strictly isolated per-task context. Automatically purged when task ends. Task assumptions never pollute Layer 2.</text>
  <!-- Chips Row 3 -->
  <!-- Chip: Token Budget: 2k–8k -->
  <rect x="106" y="390" width="148" height="26" rx="6" ry="6" fill="white" stroke="#10b981" stroke-width="1"/>
  <text x="180" y="407" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#064e3b">Token Budget: 2k–8k</text>
  <!-- Chip: Scope: file→deep -->
  <rect x="264" y="390" width="140" height="26" rx="6" ry="6" fill="white" stroke="#10b981" stroke-width="1"/>
  <text x="334" y="407" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#064e3b">Scope: file→deep</text>
  <!-- Chip: Auto-purged on done -->
  <rect x="414" y="390" width="152" height="26" rx="6" ry="6" fill="white" stroke="#10b981" stroke-width="1"/>
  <text x="490" y="407" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#064e3b">Auto-purged on done</text>

  <!-- Bottom Note -->
  <text x="450" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">All layers are strictly local · .projectmind/ is excluded from Git automatically</text>
</svg>
