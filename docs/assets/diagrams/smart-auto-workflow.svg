<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#f8fafc" rx="0"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Smart Auto Mode — Zero-Command Lifecycle</text>
  <text x="450" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Automatically triggered by your coding agent · No manual commands required</text>

  <!-- ===== PHASE 1 BOX ===== -->
  <rect x="30" y="68" width="260" height="285" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <!-- Phase 1 circle icon -->
  <circle cx="80" cy="98" r="14" fill="#3b82f6"/>
  <text x="80" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <!-- Phase 1 label -->
  <text x="98" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd" font-weight="600" letter-spacing="1">FIRST USE</text>
  <text x="98" y="104" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Initialize</text>
  <!-- Subtitle -->
  <text x="160" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Project opened for first time</text>
  <!-- Divider -->
  <line x1="46" y1="134" x2="274" y2="134" stroke="#bfdbfe" stroke-width="1"/>
  <!-- Steps -->
  <text x="50" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#374151">① Detect project root</text>
  <text x="50" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#374151">② 7-stage bootstrap scan</text>
  <text x="50" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#374151">③ Build code graph &amp; symbols</text>
  <text x="50" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#374151">④ Index modules &amp; routes</text>
  <text x="50" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#374151">⑤ Create SQLite DB in .projectmind/</text>
  <!-- Bottom badge -->
  <rect x="62" y="315" width="156" height="24" rx="12" fill="#3b82f6"/>
  <text x="140" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">One-time · ~seconds</text>

  <!-- ===== ARROW 1 (Phase 1 → Phase 2) ===== -->
  <line x1="292" y1="210" x2="318" y2="210" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="305" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" font-weight="600">ready</text>

  <!-- ===== PHASE 2 BOX ===== -->
  <rect x="320" y="68" width="260" height="285" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Phase 2 circle icon -->
  <circle cx="370" cy="98" r="14" fill="#8b5cf6"/>
  <text x="370" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <!-- Phase 2 label -->
  <text x="388" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd" font-weight="600" letter-spacing="1">EVERY TASK</text>
  <text x="388" y="104" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Retrieve Context</text>
  <!-- Subtitle -->
  <text x="450" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Before each agent response</text>
  <!-- Divider -->
  <line x1="336" y1="134" x2="564" y2="134" stroke="#ddd6fe" stroke-width="1"/>
  <!-- Steps -->
  <text x="340" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#374151">① Detect task type &amp; scope</text>
  <text x="340" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#374151">② BM25 FTS5 search</text>
  <text x="340" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#374151">③ Feature-hash reranking</text>
  <text x="340" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#374151">④ Token-budget enforcement</text>
  <text x="340" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#374151">⑤ Inject context digest</text>
  <!-- Bottom badge -->
  <rect x="352" y="315" width="156" height="24" rx="12" fill="#8b5cf6"/>
  <text x="430" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Automatic · &lt;100ms</text>

  <!-- ===== ARROW 2 (Phase 2 → Phase 3) ===== -->
  <line x1="582" y1="210" x2="608" y2="210" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="595" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10b981" font-weight="600">after edit</text>

  <!-- ===== PHASE 3 BOX ===== -->
  <rect x="610" y="68" width="260" height="285" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <!-- Phase 3 circle icon -->
  <circle cx="660" cy="98" r="14" fill="#10b981"/>
  <text x="660" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <!-- Phase 3 label -->
  <text x="678" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" font-weight="600" letter-spacing="1">AFTER EACH EDIT</text>
  <text x="678" y="104" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#064e3b">Sync Changes</text>
  <!-- Subtitle -->
  <text x="740" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">After files are modified</text>
  <!-- Divider -->
  <line x1="626" y1="134" x2="854" y2="134" stroke="#bbf7d0" stroke-width="1"/>
  <!-- Steps -->
  <text x="630" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#374151">① SHA-256 fingerprint check</text>
  <text x="630" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#374151">② Re-index changed files only</text>
  <text x="630" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#374151">③ Update code graph edges</text>
  <text x="630" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#374151">④ Promote planned → verified</text>
  <text x="630" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#374151">⑤ Invalidate stale cache</text>
  <!-- Bottom badge -->
  <rect x="642" y="315" width="196" height="24" rx="12" fill="#10b981"/>
  <text x="740" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Incremental · delta only</text>

  <!-- ===== CURVED LOOP ARROW (Phase 3 → Phase 2) ===== -->
  <!-- Path from bottom-right of Phase 3 curving back to bottom-left of Phase 2 -->
  <path d="M 740 355 Q 740 390 580 390 Q 420 390 450 355" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowLoop)"/>
  <text x="595" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">continuous loop</text>

  <!-- ===== BOTTOM STAT BADGES ===== -->
  <!-- Badge 1 -->
  <rect x="174" y="372" width="168" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="258" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#374151">⚡ Offline · No API keys</text>

  <!-- Badge 2 -->
  <rect x="366" y="372" width="168" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#374151">🔒 Local SQLite only</text>

  <!-- Badge 3 -->
  <rect x="558" y="372" width="168" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="642" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#374151">♻️ Incremental re-index</text>
</svg>
