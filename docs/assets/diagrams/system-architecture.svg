      <text x="856" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">Security Engine</text>
      <text x="856" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Secret &amp; token redaction</text>
      <text x="856" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Path traversal defense</text>
      <text x="856" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Symlink boundary lock</text>
      <text x="856" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Prompt-injection filter</text>
