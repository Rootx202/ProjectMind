      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• State machine engine</text>
      <text x="16" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Warm reuse (0 rescans)</text>
      <text x="16" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Safe fail-open boundaries</text>

      <!-- Box 2 -->
      <rect x="210" y="0" width="190" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="226" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">7-Stage Bootstrap</text>
      <text x="226" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Repo inventory &amp; configs</text>
      <text x="226" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Module topology graph</text>
      <text x="226" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Symbols, routes, models</text>
      <text x="226" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• SHA-256 fingerprints</text>

      <!-- Box 3 -->
      <rect x="420" y="0" width="190" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="436" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Impact Analysis</text>
      <text x="436" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Direct &amp; transitive deps</text>
      <text x="436" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Reverse dependents</text>
      <text x="436" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Blast-radius score (0-100)</text>
      <text x="436" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Deep analysis trigger</text>

      <!-- Box 4 -->
      <rect x="630" y="0" width="190" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="646" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Hybrid Retrieval</text>
      <text x="646" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• SQLite FTS5 BM25 search</text>
      <text x="646" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Local hash-vector rerank</text>
      <text x="646" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Token-budget enforcer</text>
      <text x="646" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Compact context digest</text>

      <!-- Box 5 -->
