<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="font-family: system-ui, sans-serif; background: #f8fafc;">

  <!-- Background -->
  <rect width="900" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">ProjectMind v2.0.0 — System Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="0.3">Local-First AI Project Intelligence · npm: @rootx202/projectmind</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROW 1: AI Coding Agents -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="66" width="860" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="36" y="84" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1" text-transform="uppercase">AI CODING AGENTS</text>

  <!-- Agent pills -->
  <!-- Antigravity -->
  <rect x="32"  y="92" width="88" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="76"  y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Antigravity</text>

  <!-- Claude Code -->
  <rect x="128" y="92" width="94" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="175" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Claude Code</text>

  <!-- Gemini CLI -->
  <rect x="230" y="92" width="86" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="273" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Gemini CLI</text>

  <!-- Cursor -->
  <rect x="324" y="92" width="68" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="358" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Cursor</text>

  <!-- Codex -->
  <rect x="400" y="92" width="64" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="432" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Codex</text>

  <!-- GitHub Copilot -->
  <rect x="472" y="92" width="112" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="528" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">GitHub Copilot</text>

  <!-- Hermes -->
  <rect x="592" y="92" width="72" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="628" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Hermes</text>

  <!-- DeepSeek -->
  <rect x="672" y="92" width="80" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="712" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">DeepSeek</text>

  <!-- OpenCode -->
  <rect x="760" y="92" width="82" height="28" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="801" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">OpenCode</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="154" x2="450" y2="183" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="159" width="330" height="18" rx="4" fill="#f8fafc"/>
  <text x="450" y="172" text-anchor="middle" font-size="11" fill="#64748b">npx -y @rootx202/projectmind mcp  (stdio MCP)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROW 2: MCP Server -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="186" width="860" height="102" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="36" y="204" font-size="11" font-weight="600" fill="#8b5cf6" letter-spacing="1">MCP SERVER</text>
  <text x="450" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">MCP Server  |  projectmind-mcp</text>

  <!-- Sub-boxes -->
  <!-- Tool Dispatcher -->
  <rect x="38"  y="222" width="250" height="52" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="163" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Tool Dispatcher</text>
  <text x="163" y="262" text-anchor="middle" font-size="11" fill="#64748b">routes MCP calls to core</text>

  <!-- Local Dashboard -->
  <rect x="325" y="222" width="250" height="52" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="450" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Local Dashboard</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#64748b">127.0.0.1 only · no CDN</text>

  <!-- stdio Transport -->
  <rect x="612" y="222" width="250" height="52" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="737" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">stdio Transport</text>
  <text x="737" y="262" text-anchor="middle" font-size="11" fill="#64748b">no network binding</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="288" x2="450" y2="316" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="398" y="293" width="104" height="18" rx="4" fill="#f8fafc"/>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#64748b">read / write</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROW 3: 3-Layer Memory -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="320" width="860" height="118" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="36" y="338" font-size="11" font-weight="600" fill="#10b981" letter-spacing="1">3-LAYER MEMORY  ·  .projectmind/projectmind.db</text>

  <!-- L1 Core Memory -->
  <rect x="38"  y="346" width="250" height="78" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="163" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">L1 Core Memory</text>
  <text x="163" y="385" text-anchor="middle" font-size="11" fill="#1e293b">Project ID · Tech Stack</text>
  <text x="163" y="402" text-anchor="middle" font-size="11" fill="#1e293b">Key Constraints</text>

  <!-- L2 Project Knowledge -->
  <rect x="325" y="346" width="250" height="78" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">L2 Project Knowledge</text>
  <text x="450" y="385" text-anchor="middle" font-size="11" fill="#1e293b">SQLite+FTS5 · Symbols · Routes</text>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#1e293b">ADRs · BM25</text>

  <!-- L3 Task Context -->
  <rect x="612" y="346" width="250" height="78" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="737" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">L3 Task Context</text>
  <text x="737" y="385" text-anchor="middle" font-size="11" fill="#1e293b">Token-budgeted · Ephemeral</text>
  <text x="737" y="402" text-anchor="middle" font-size="11" fill="#1e293b">Auto-purged</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="438" x2="450" y2="466" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROW 4: Security & Privacy -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="470" width="860" height="72" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="36" y="488" font-size="11" font-weight="600" fill="#ea580c" letter-spacing="1">SECURITY &amp; PRIVACY</text>

  <!-- Badge 1 -->
  <rect x="38"  y="496" width="192" height="32" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="134" y="517" text-anchor="middle" font-size="13" fill="#1e293b">🔒 100% Offline</text>

  <!-- Badge 2 -->
  <rect x="242" y="496" width="192" height="32" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="338" y="517" text-anchor="middle" font-size="13" fill="#1e293b">🛡️ Secret Redaction</text>

  <!-- Badge 3 -->
  <rect x="446" y="496" width="210" height="32" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="551" y="517" text-anchor="middle" font-size="13" fill="#1e293b">🚫 Path Traversal Guard</text>

  <!-- Badge 4 -->
  <rect x="668" y="496" width="194" height="32" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="765" y="517" text-anchor="middle" font-size="13" fill="#1e293b">✅ Zero Cloud Required</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Arrowhead marker -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

</svg>
