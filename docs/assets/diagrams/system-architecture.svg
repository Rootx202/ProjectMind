    <text x="64" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">ProjectMind System Architecture</text>
    <text x="64" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Universal Local-First AI Project Intelligence &amp; 3-Layer Persistent Memory Architecture</text>
  </g>

