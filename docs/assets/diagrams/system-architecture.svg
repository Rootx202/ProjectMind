        <text x="52" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">Hermes Agent</text>
        <text x="52" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">HERMES.md Loop</text>
      </g>
