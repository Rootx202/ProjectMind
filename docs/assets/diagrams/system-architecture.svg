      <!-- Layer 1 -->
      <rect x="0" y="0" width="330" height="118" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="4" fill="#3b82f6"/>
      <text x="23" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text>
      <text x="42" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Layer 1: Core Memory</text>
      <text x="14" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Permanent ultra-compact project identity:</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Stable Project ID, Name, Verified Commit</text>
      <text x="14" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Tech Stack, Architecture summary, Key constraints</text>
      <text x="14" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Zero-drift moving project path reconciliation</text>

      <!-- Layer 2 -->
      <rect x="350" y="0" width="345" height="118" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="362" y="12" width="22" height="22" rx="4" fill="#8b5cf6"/>
      <text x="373" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">L2</text>
      <text x="392" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Layer 2: Project Knowledge</text>
      <text x="364" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Searchable SQLite + FTS5 BM25 Knowledge Base:</text>
      <text x="364" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Modules, public exported symbols, dependencies</text>
      <text x="364" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• HTTP API route catalog, DB schemas &amp; models</text>
      <text x="364" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• ADRs with provenance &amp; verification status</text>

      <!-- Layer 3 -->
      <rect x="715" y="0" width="317" height="118" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="727" y="12" width="22" height="22" rx="4" fill="#10b981"/>
      <text x="738" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">L3</text>
      <text x="757" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Layer 3: Task Context</text>
      <text x="729" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Strictly isolated ephemeral context state:</text>
      <text x="729" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Token-budgeted retrieval packages</text>
      <text x="729" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Scope: none | file | module | cross | deep</text>
      <text x="729" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Task assumptions never pollute Layer 2 knowledge</text>
    </g>
  </g>
</svg>

