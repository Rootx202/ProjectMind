        <text x="52" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">JSON Stdout Hooks</text>
      </g>
      <g transform="translate(575, 0)">
        <rect width="105" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="52" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">GitHub Copilot</text>
        <text x="52" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">VS Code + Prompts</text>
