    <text y="344" fill="#94a3b8">  }</text>
    <text y="362" fill="#94a3b8">}</text>

    <text y="400">
      <tspan fill="#10b981" font-weight="700">user@workspace</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8" font-weight="700">~/projectmind</tspan><tspan fill="#f1f5f9">$ </tspan><tspan fill="#38bdf8">█</tspan>
    </text>
