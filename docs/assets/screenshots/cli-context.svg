    </text>
    <text y="248">
      <tspan fill="#94a3b8">  "deepAnalysisExplanation": </tspan><tspan fill="#cbd5e1">"Task spans interconnected modules. Expanded dependency context automatically."</tspan><tspan fill="#94a3b8">,</tspan>
    </text>

    <text y="272" fill="#94a3b8">  "tokenBudget": {</text>
    <text y="290">
      <tspan fill="#94a3b8">    "budgetTokens": </tspan><tspan fill="#f59e0b">4000</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text y="308">
      <tspan fill="#94a3b8">    "estimatedTokensUsed": </tspan><tspan fill="#34d399" font-weight="700">768</tspan><tspan fill="#64748b"> (19.2% of allocation)</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text y="326">
