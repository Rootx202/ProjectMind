    <text y="78">
      <tspan fill="#94a3b8">  "scopeLevel": </tspan><tspan fill="#f59e0b">"module"</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text y="96">
      <tspan fill="#94a3b8">  "retrievalNeeded": </tspan><tspan fill="#34d399">true</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text y="114">
      <tspan fill="#94a3b8">  "projectOverview": { </tspan><tspan fill="#cbd5e1">"name": "projectmind", "techStack": ["TypeScript"], "state": "bootstrapped"</tspan><tspan fill="#94a3b8"> },</tspan>
    </text>
    
    <text y="136" fill="#94a3b8">  "relevantModules": [</text>
    <text y="154">
      <tspan fill="#94a3b8">    { "moduleId": </tspan><tspan fill="#38bdf8">"adapters/antigravity"</tspan><tspan fill="#94a3b8">, "publicSymbols": [</tspan><tspan fill="#c084fc">"AntigravityAdapter"</tspan><tspan fill="#94a3b8">] },</tspan>
    </text>
    <text y="172">
      <tspan fill="#94a3b8">    { "moduleId": </tspan><tspan fill="#38bdf8">"adapters/claude-code"</tspan><tspan fill="#94a3b8">, "publicSymbols": [</tspan><tspan fill="#c084fc">"ClaudeCodeAdapter"</tspan><tspan fill="#94a3b8">] },</tspan>
    </text>
    <text y="190">
      <tspan fill="#94a3b8">    { "moduleId": </tspan><tspan fill="#38bdf8">"packages/agent-sdk"</tspan><tspan fill="#94a3b8">,   "publicSymbols": [</tspan><tspan fill="#c084fc">"SmartAutoModeEngine", "AgentAdapter"</tspan><tspan fill="#94a3b8">] }</tspan>
    </text>
    <text y="208" fill="#94a3b8">  ],</text>

    <text y="230">
