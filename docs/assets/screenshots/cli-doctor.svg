<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Terminal Window Outer -->
  <g filter="url(#shadow)">
    <rect width="920" height="440" rx="10" fill="url(#termGrad)" stroke="#334155" stroke-width="1"/>
    
    <!-- Title Bar -->
    <path d="M0 10C0 4.477 4.477 0 10 0h900c5.523 0 10 4.477 10 10v28H0V10z" fill="#1e293b"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="6" fill="#10b981"/>
    <text x="460" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">terminal — projectmind plugin doctor</text>
  </g>

  <!-- Terminal Body -->
  <g transform="translate(24, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" line-height="1.5">
    <!-- Prompt -->
    <text y="0">
      <tspan fill="#10b981" font-weight="700">user@workspace</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8" font-weight="700">~/projectmind</tspan><tspan fill="#f1f5f9">$ projectmind plugin doctor</tspan>
    </text>

    <!-- Output -->
    <text y="30" fill="#f8fafc" font-weight="700">ProjectMind Plugin Diagnostics</text>
    <text y="48" fill="#475569">===============================</text>
    <text y="70">
      <tspan fill="#94a3b8">Project Root: </tspan><tspan fill="#f1f5f9">/home/user/projectmind</tspan>
    </text>
    <text y="90">
      <tspan fill="#94a3b8">Platform:     </tspan><tspan fill="#38bdf8">linux</tspan>
    </text>
    <text y="110">
      <tspan fill="#94a3b8">Node.js:      </tspan><tspan fill="#a7f3d0">Node.js v24.11.1</tspan><tspan fill="#64748b"> (requires &gt;= 18.0.0)</tspan>
    </text>
    <text y="130">
      <tspan fill="#94a3b8">Runtime:      </tspan><tspan fill="#e2e8f0">node_module_resolution</tspan>
    </text>
    <text y="150">
      <tspan fill="#94a3b8">Filesystem:   </tspan><tspan fill="#34d399">Read/Write verified</tspan>
    </text>
    <text y="170">
      <tspan fill="#94a3b8">System Status: </tspan><tspan fill="#10b981" font-weight="700">✓ HEALTHY</tspan>
    </text>

    <text y="202" fill="#f8fafc" font-weight="700">Adapters:</text>
    <text y="224">
      <tspan fill="#cbd5e1">    Google Antigravity (antigravity): </tspan><tspan fill="#34d399">Detected</tspan><tspan fill="#64748b"> [0/3 checks]</tspan>
    </text>
    <text y="244">
      <tspan fill="#cbd5e1">    OpenAI Codex (codex): </tspan><tspan fill="#94a3b8">Inactive</tspan><tspan fill="#64748b"> [1/3 checks]</tspan>
    </text>
    <text y="264">
      <tspan fill="#cbd5e1">    Anthropic Claude Code (claude-code): </tspan><tspan fill="#34d399">Detected</tspan><tspan fill="#64748b"> [1/4 checks]</tspan>
    </text>
    <text y="284">
      <tspan fill="#cbd5e1">    Google Gemini CLI (gemini-cli): </tspan><tspan fill="#34d399">Detected</tspan><tspan fill="#64748b"> [1/3 checks]</tspan>
    </text>
    <text y="304">
      <tspan fill="#cbd5e1">    Cursor IDE &amp; Agent CLI (cursor): </tspan><tspan fill="#94a3b8">Inactive</tspan><tspan fill="#64748b"> [0/3 checks]</tspan>
    </text>
    <text y="324">
      <tspan fill="#cbd5e1">    GitHub Copilot (github-copilot): </tspan><tspan fill="#34d399">Detected</tspan><tspan fill="#64748b"> [1/3 checks]</tspan>
    </text>
    <text y="344">
      <tspan fill="#cbd5e1">    OpenCode (opencode): </tspan><tspan fill="#34d399">Detected</tspan><tspan fill="#64748b"> [1/3 checks]</tspan>
    </text>
  </g>
</svg>
