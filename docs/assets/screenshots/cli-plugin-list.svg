      <tspan x="490" fill="#94a3b8">1.0.0</tspan>
      <tspan x="560" fill="#94a3b8">✗ No</tspan>
      <tspan x="645" fill="#34d399">✓ Yes</tspan>
      <tspan x="725" fill="#a7f3d0">hooks, mcp, rules, skills</tspan>
