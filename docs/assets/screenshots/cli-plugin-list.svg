      <tspan x="140">Agent Name</tspan>
      <tspan x="490">Version</tspan>
      <tspan x="560">Installed</tspan>
      <tspan x="645">Detected</tspan>
      <tspan x="725">Capabilities</tspan>
    </text>
    <text y="78" fill="#475569">----------------  ----------------------------------------------  -------  ---------  --------  -------------------------</text>

