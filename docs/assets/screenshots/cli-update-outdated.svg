<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Terminal Window Outer -->
  <g filter="url(#shadow)">
    <rect width="920" height="540" rx="10" fill="url(#termGrad)" stroke="#334155" stroke-width="1"/>
    
    <!-- Title Bar -->
    <path d="M0 10C0 4.477 4.477 0 10 0h900c5.523 0 10 4.477 10 10v28H0V10z" fill="#1e293b"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="6" fill="#10b981"/>
    <text x="460" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">terminal — projectmind update check &amp; plugin outdated</text>
  </g>

